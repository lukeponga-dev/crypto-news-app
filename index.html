<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CryptoPulse | Real-time Crypto News</title>
    <meta name="description" content="Stay ahead of the market with CryptoPulse. Real-time news, market insights, and price tracking for the cryptocurrency world." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#06b6d4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CryptoPulse" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="glass-header">
        <div class="container">
          <div class="logo">
            <span class="icon">⚡</span>
            <h1>Crypto<span>Pulse</span></h1>
          </div>
          <nav>
            <button id="refresh-btn" class="btn-icon" title="Refresh News">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
            </button>
            <div class="search-box">
              <input type="text" id="news-search" placeholder="Search news..." />
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </div>
          </nav>
        </div>
      </header>

      <main class="container">
        <section class="ticker-section">
          <div id="price-ticker" class="ticker-wrapper">
            <!-- Price cards will be injected here -->
            <div class="ticker-item loading">Loading prices...</div>
          </div>
        </section>

        <section class="filters">
          <button class="filter-btn active" data-category="ALL">All News</button>
          <button class="filter-btn" data-category="BITCOIN">Bitcoin</button>
          <button class="filter-btn" data-category="ETHEREUM">Ethereum</button>
          <button class="filter-btn" data-category="ALTCOIN">Altcoins</button>
          <button class="filter-btn" data-category="BLOCKCHAIN">Blockchain</button>
          <button class="filter-btn" data-category="REGULATION">Regulation</button>
        </section>

        <div id="news-grid" class="news-grid">
          <!-- News cards will be injected here -->
          <div class="loading-state">
            <div class="spinner"></div>
            <p>Fetching the latest crypto pulse...</p>
          </div>
        </div>
      </main>

      <footer class="footer">
        <div class="container">
          <p>&copy; 2025 CryptoPulse. Data provided by CryptoCompare.</p>
        </div>
      </footer>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
